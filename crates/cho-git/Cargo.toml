[package]
name = "cho-git"
description = "Read-only git facts for Chorong: repository identity, worktrees, commits, diffs, files at a revision, tree compares and merge bases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
cho-core.workspace = true
gix = { version = "0.90", default-features = false, features = ["revision", "sha1", "status"] }

[dev-dependencies]
cho-core = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
