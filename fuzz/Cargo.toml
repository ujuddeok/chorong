[package]
name = "cho-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
cho-changes = { path = "../crates/cho-changes" }
cho-core = { path = "../crates/cho-core" }
cho-git = { path = "../crates/cho-git" }
cho-graph = { path = "../crates/cho-graph" }
cho-investigation = { path = "../crates/cho-investigation" }
cho-layout = { path = "../crates/cho-layout" }
cho-search = { path = "../crates/cho-search" }
cho-semantic = { path = "../crates/cho-semantic" }
cho-settings = { path = "../crates/cho-settings" }
cho-sources = { path = "../crates/cho-sources" }
cho-syntax = { path = "../crates/cho-syntax" }
cho-theme = { path = "../crates/cho-theme" }
protobuf = "3"
scip = "0.10"
serde_json = "1"

[workspace]

[[bin]]
name = "source_buffer"
path = "fuzz_targets/source_buffer.rs"
test = false
doc = false
